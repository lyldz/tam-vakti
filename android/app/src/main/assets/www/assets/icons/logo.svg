<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Zemin Gradyanı: Derin Gece Laciverti (Nocturnal Arctic) -->
    <radialGradient id="arcticBg" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#121e3a"/>
      <stop offset="55%" stop-color="#0a1224"/>
      <stop offset="100%" stop-color="#050812"/>
    </radialGradient>

    <!-- Buzul Cyan Gradyanı (Hilal & Ana Vurgular) -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="25%" stop-color="#7dd3fc"/>
      <stop offset="60%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Mercan & Kehribar (Kerahat & Ufuk Işığı) -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="50%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Parıltı / Glow Filtresi -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Arka Plan Squircle (Modern App İkonu) -->
  <rect x="16" y="16" width="480" height="480" rx="115" ry="115" fill="url(#arcticBg)"/>

  <!-- Buzul Cyan İnce Dış Çerçeve -->
  <rect x="20" y="20" width="472" height="472" rx="111" ry="111" fill="none" stroke="url(#cyanGrad)" stroke-width="3" stroke-opacity="0.45"/>
  <rect x="28" y="28" width="456" height="456" rx="103" ry="103" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.15"/>

  <!-- Astronomik Pusula & Zaman Çemberi -->
  <g opacity="0.18" stroke="#38bdf8" stroke-width="1.5">
    <circle cx="256" cy="256" r="185" fill="none"/>
    <circle cx="256" cy="256" r="150" fill="none" stroke-dasharray="3 7"/>
    <!-- Kadran İşaretleri -->
    <line x1="256" y1="62" x2="256" y2="78" stroke-width="2.5"/>
    <line x1="256" y1="434" x2="256" y2="450" stroke-width="2.5"/>
    <line x1="62" y1="256" x2="78" y2="256" stroke-width="2.5"/>
    <line x1="434" y1="256" x2="450" y2="256" stroke-width="2.5"/>
  </g>

  <!-- Göksel Ambient Işıma -->
  <circle cx="256" cy="235" r="95" fill="#38bdf8" opacity="0.1" filter="url(#cyanGlow)"/>

  <!-- Ana İkon Grubu (Hilal, Geometrik Yıldız & Ufuk Çizgisi) -->
  <g filter="url(#shadowFilter)">
    <!-- Modern Hilal (Crescent Moon) -->
    <path d="M 285 130 
             C 205 130 145 190 145 270 
             C 145 350 205 410 285 410 
             C 325 410 360 395 385 370 
             C 305 385 225 330 225 260 
             C 225 195 295 145 375 160 
             C 350 140 320 130 285 130 Z" 
          fill="url(#cyanGrad)" 
          filter="url(#cyanGlow)"/>

    <!-- 8 Köşeli Selçuklu / İslam Geometrik Yıldızı -->
    <g transform="translate(325, 225) scale(0.68)">
      <!-- Yıldız Işıması -->
      <polygon points="0,-48 14,-14 48,0 14,14 0,48 -14,14 -48,0 -14,-14" fill="url(#cyanGrad)"/>
      <polygon points="-34,-34 0,-20 34,-34 20,0 34,34 0,20 -34,34 -20,0" fill="url(#cyanGrad)"/>
      <!-- Yıldız Merkezi -->
      <circle cx="0" cy="0" r="10" fill="#ffffff" filter="url(#cyanGlow)"/>
    </g>

    <!-- Minimalist Ufuk Hattı (Horizon Line & Kehribar Kerahat Noktası) -->
    <line x1="165" y1="365" x2="347" y2="365" stroke="url(#cyanGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
    <circle cx="256" cy="365" r="5" fill="url(#amberGrad)" filter="url(#cyanGlow)"/>
  </g>

</svg>
