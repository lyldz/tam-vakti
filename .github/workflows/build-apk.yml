name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.01' }}"
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti-${TAG}.apk \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.08' }}
          files: build-output/*.apk
          name: "Tam Vakti ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.08' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🧭 Tam Vakti v1.00.08 - Yenilenen Canlı Donanım Pusulası & Harita ile Kıble

            - **Sürüm:** `${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.08' }}`
            - **Paket Adı:** `com.tamvakti.app`
            
            ### 📝 Yenilikler ve Değişiklikler (v1.00.08)
            - 🧭 **Android Native Donanım Sensörü (SensorManager):** WebView'ın tutarsız çalışan sensörü yerine Android'in kalibreli `Rotation Vector` donanım füzyon sensörü entegre edildi.
            - 📍 **Gerçek Coğrafi Kuzey (True North Declination):** `GeomagneticField` ile kullanıcının GPS konumuna göre manyetik sapma açısı otomatik düzeltilerek %100 coğrafi kıble açısı hesaplanır.
            - 🟢 **Dairesel EMA Titreşim Filtresi:** İbrenin titremesini ve 360° sıçramalarını engelleyen yumuşak süzgeç eklendi.
            - 🎯 **Akıllı Kılavuz Rozeti:** Ekranda dinamik `→ 35° Sağa dön`, `← 15° Sola dön` ve tam hedefe ulaşıldığında `✓ KIBLE YÖNÜNDESİN` rozeti ve titreşimli geri bildirim.
            - ⚖️ **Dijital Su Terazisi (Bubble Level):** Kadranın merkezinde telefonun düz tutulup tutulmadığını gösteren canlı su terazisi balonu.
            - ☀️ **Canlı Güneş İbresi & Kıble Saati:** Kadran üzerinde anlık güneş yönü ikonu ve Diyanet klasik Kıble Saati ("Güneşe baktığınız an Kâbe yönündesiniz") bilgi kartı.
            - 🗺️ **Harita / Sokak Yönü (Pusulasız Kesin Çözüm):** Manyetik bozulmalardan hiç etkilenmeyen; evinizi, balkonunuzu ve sokağınızı harita üzerinde görerek Kâbe'ye uzanan yeşil hattı takip edebileceğiniz interaktif harita modu eklendi.
            
            ### 📱 Kurulum
            Aşağıdaki `TamVakti-v1.00.08.apk` veya `TamVakti.apk` dosyasını indirip doğrudan cihazınıza kurabilirsiniz.

