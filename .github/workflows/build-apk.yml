name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.11.1'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Decode release keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              echo "::error::KEYSTORE_BASE64 secret tanımlı değil; yayın APK'sı imzasız/yanlış imzalı olur."
              exit 1
            fi
            echo "Keystore secret yok; debug imzasıyla devam (yayın yapılmayacak)."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TAMVAKTI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      # GitHub sürümü: APK (uygulama içi güncelleme var). Play sürümü: AAB (kendini güncelleme yok).
      - name: Build GitHub APK and Play AAB
        working-directory: android
        env:
          TAMVAKTI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TAMVAKTI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TAMVAKTI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleGithubRelease bundlePlayRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}"
          find android/app/build/outputs/apk/github -name "*.apk" -exec cp {} build-output/TamVakti-${TAG}.apk \;
          find android/app/build/outputs/apk/github -name "*.apk" -exec cp {} build-output/TamVakti.apk \;
          mkdir -p play-output
          find android/app/build/outputs/bundle/playRelease -name "*.aab" -exec cp {} play-output/TamVakti-play-${TAG}.aab \;
          ls -lh build-output/ play-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/*.apk

      - name: Upload Play AAB as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-Play-AAB
          path: play-output/*.aab

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          f="notes/${{ github.ref_name }}.md"
          if [ ! -f "$f" ]; then
            mkdir -p notes
            echo "- Küçük iyileştirmeler ve hata düzeltmeleri." > "$f"
          fi

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: build-output/*.apk
          name: "Tam Vakti ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body_path: notes/${{ github.ref_name }}.md
