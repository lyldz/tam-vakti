name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.01' }}"
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti-${TAG}.apk \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.07' }}
          files: build-output/*.apk
          name: "Tam Vakti ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.07' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎨 Tam Vakti v1.00.07 - Yepyeni İkon Paketi & Bildirim Simgesi

            - **Sürüm:** `${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.07' }}`
            - **Paket Adı:** `com.tamvakti.app`
            
            ### 📝 Yenilikler ve Değişiklikler (v1.00.07)
            - 🌟 **Yeni Uygulama Simgesi (App Launcher Icon):** Android 8-16 için yüksek çözünürlüklü vektör adaptive ikon ve zümrüt mihrap kemeri, parıldayan hilal ve Selçuklu yıldızı motifi.
            - 🔔 **Yeni Bildirim Simgesi (Notification Status Bar Icon):** Durum çubuğunda kristal netliğinde kubbe ve hilal silüeti (`ic_stat_tamvakti`). Ayrıca bildirim panelinde uygulamanın renkli logosu (`setLargeIcon`).
            - 🕌 **Yenilenen Vakit İkon Paketi:** İmsak, Güneş, Öğle, İkindi, Akşam ve Yatsı için özel minimalist çizgi sanat (line-art) ikon seti ve pastel tonlu estetik zeminler.
            - 🔊 **Yüksek Kontrastlı Ses İkonları:** Sessiz ve sesli durumlar için maksimum okunurluk ve netlik.
            
            ### 📱 Kurulum
            Aşağıdaki `TamVakti-v1.00.07.apk` veya `TamVakti.apk` dosyasını indirip doğrudan cihazınıza kurabilirsiniz.

