name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.01' }}"
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti-${TAG}.apk \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.06' }}
          files: build-output/*.apk
          name: "Tam Vakti ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.06' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🕌 Tam Vakti v1.00.06 - Derli Toplu Ayarlar & Yenilenen Kıble Pusulası

            - **Sürüm:** `${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.06' }}`
            - **Paket Adı:** `com.tamvakti.app`
            
            ### 📝 Yenilikler ve Değişiklikler (v1.00.06)
            - ⚙️ **Derli Toplu Ayarlar Ekranı:** 5 ana grup kartı altında toplanmış modern arayüz (Bildirim Sağlığı, Bildirim & Ezan, Hesaplama, Görünüm, Hakkında).
            - 🔔 **Bildirim Sağlığı & Test:** Tam zamanlı alarm izni, Android pil optimizasyonunu kapatma köprüsü ve tek dokunuşla anında test bildirimi ve ezan sesi gönderen buton.
            - 🕋 **Yenilenen Kıble Pusulası:**
              - Üstte sabit Kâbe hedef pini (🕋) ve çevrimdışı çalışma göstergesi.
              - Büyük açı göstergesi (`152°`) ve Kâbe mesafesi (`≈ 2.200 km`).
              - ±3° kıble hizalanmasında yeşil çember parlaması, `✓ Kıble'desin` rozeti ve zarif cihaz titreşimi.
              - Eğim ve sensör kalibrasyon rehberi.
            
            ### 📱 Kurulum
            Aşağıdaki `TamVakti-v1.00.06.apk` veya `TamVakti.apk` dosyasını indirip doğrudan cihazınıza kurabilirsiniz.

