name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.01' }}"
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti-${TAG}.apk \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.01' }}
          files: build-output/*.apk
          name: "Tam Vakti ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.01' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🌟 Tam Vakti v1.01 - Sadeleşmiş Üst Bar, Kerahat Göstergesi, Tek Odaklı Vakit & Bütünleşik Alt Bar

            - **Sürüm:** `${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.01' }}`
            - **Paket Adı:** `com.tamvakti.app`
            
            ### 📝 Yenilikler ve Değişiklikler (v1.01)
            - 🌿 **Üst Bar Sadeleşmesi:** Ortadaki "Tam Vakti" butonu kaldırılarak üst alan ferahlatıldı; sağdaki tarih alanına takvim ikonu ve gün geçiş oku (>) eklendi.
            - 🟠 **Kerahat Vakti Göstergesi:** İlerleme çubuğunun başına ve sonuna kehribar rengi kerahat dilimleri eklendi, sağ alttaki mükerrer vakit yazısı yerine anlık kehribar rozetli "Kerahat: 11:58" bilgisi yerleştirildi.
            - 🎯 **Tek Odaklı Vakit Vurgusu:** Geçmiş olan Güneş satırı da İmsak gibi soluklaştırıldı; tüm odak "Cuma (Öğle)" ve "Sıradaki" etiketiyle tek bir satırda toplandı.
            - 🔔 **Erken Hatırlatma Rozeti:** Hoparlör ikonunun yanına vakitten önce bildirim verileceğini gösteren küçük bir `-15dk` rozeti eklendi.
            - 🎛️ **Bütünleşik Alt Bar:** Sol altta tek başına duran çark ikonu kaldırılarak `Vakitler | Kıble | Ayarlar ⚙️` şeklinde tek bir kapsül menüde birleştirildi.
            
            ### 📱 Kurulum
            Aşağıdaki `TamVakti-v1.01.apk` veya `TamVakti.apk` dosyasını indirip doğrudan cihazınıza kurabilirsiniz.

