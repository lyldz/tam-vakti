name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.01' }}"
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti-${TAG}.apk \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.09' }}
          files: build-output/*.apk
          name: "Tam Vakti ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.09' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🎨 Tam Vakti v1.00.09 - Orijinal Yeşil Logo, Siyah-Beyaz Bildirim İkonu & Gelişmiş Donanım Pusulası

            - **Sürüm:** `${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.09' }}`
            - **Paket Adı:** `com.tamvakti.app`
            
            ### 📝 Yenilikler ve Değişiklikler (v1.00.09)
            - 🟢 **Orijinal Yeşil Uygulama Logosu:** Cihaz ana ekranı ve uygulama çekmecesi için orijinal su yeşili logo paketi entegre edildi.
            - ⚪ **Siyah-Beyaz / Beyaz Bildirim Simgesi:** Android durum çubuğu ve bildirim gölgesi için temiz, net, şeffaf arka planlı monokrom bildirim simgesi eklendi.
            - 🧭 **Android Native Donanım Sensörü (SensorManager):** WebView yerine donanımsal `Rotation Vector`, `Accelerometer` ve `Magnetometer` sensör füzyonu entegre edildi.
            - 📍 **Gerçek Coğrafi Kuzey (True North Declination):** `GeomagneticField` ile kullanıcının GPS koordinatlarına göre manyetik sapma açısı düzeltildi.
            - 🟢 **Dairesel EMA Titreşim Filtresi:** İbrenin titremesini ve 360° sıçramalarını önleyen süzgeç.
            - 🎯 **Dinamik Kılavuz Rozeti:** Dönüş yönü (`→ XX° Sağa dön`, `✓ KIBLE YÖNÜNDESİN`) ve titreşimli geri bildirim.
            - ⚖️ **Dijital Su Terazisi (Bubble Level):** Kadran merkezinde canlı su terazisi balonu.
            - ☀️ **Canlı Güneş İbresi & Diyanet Kıble Saati:** Kadran üzerinde anlık güneş yönü ve Diyanet klasik Kıble Saati bilgisi.
            - 🗺️ **Harita / Sokak Yönü (Offline Leaflet):** Manyetik bozulmalardan etkilenmeyen sokak ve bina bazlı Kâbe istikameti haritası.
            
            ### 📱 Kurulum
            Aşağıdaki `TamVakti-v1.00.09.apk` veya `TamVakti.apk` dosyasını indirip doğrudan cihazınıza kurabilirsiniz.

