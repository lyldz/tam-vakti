name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.01' }}"
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti-${TAG}.apk \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.05' }}
          files: build-output/*.apk
          name: "Tam Vakti ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.05' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🕌 Tam Vakti v1.00.05 - Namaz & İbadet Asistanı

            - **Sürüm:** `${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.05' }}`
            - **Paket Adı:** `com.tamvakti.app`
            
            ### 📝 Yenilikler ve Değişiklikler (v1.00.05)
            - 🚀 **Otomatik GitHub Güncelleme Sistemi:** Yeni bir sürüm yayınlandığında uygulama arka planda GitHub Releases API'den son sürümü otomatik olarak denetler.
            - 🔴 **Kırmızı Bildirim Noktası:** Yeni sürüm algılandığında ana ekrandaki tarih başlığında parıldayan kırmızı bildirim noktası belirir.
            - 📦 **Uygulama İçi Tek Dokunuşla Kurulum:** Tarihe veya "Hakkında" penceresine dokunulduğunda sürüm notları görüntülenir ve "Şimdi Güncelle ve İndir" butonuyla APK indirilip Android Paket Yükleyicisi otomatik olarak başlatılır.
            - 🔄 **Manuel Güncelleme Denetimi:** Hakkında penceresinde istenildiği an güncellemeleri manuel kontrol edebilme imkanı.
            
            ### 📱 Kurulum
            Aşağıdaki `TamVakti-v1.00.05.apk` veya `TamVakti.apk` dosyasını indirip doğrudan cihazınıza kurabilirsiniz.
