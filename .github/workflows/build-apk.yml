name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti-2026.10.12.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/TamVakti-2026.10.12.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2026.10.12' }}
          files: build-output/TamVakti-2026.10.12.apk
          name: "Tam Vakti ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v2026.10.12' }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            ## 🕌 Tam Vakti - Namaz & İbadet Asistanı

            - **Sürüm:** `2026.10.12` (CalVer)
            - **Paket Adı:** `com.tamvakti.app`
            
            ### ✨ Öne Çıkan Özellikler
            - ⏱️ Diyanet İşleri Başkanlığı uyumlu vakit motoru (Offline & Online Hibrit)
            - 🧭 Gerçek Zamanlı Kıble Pusulası (Sensör Entegrasyonu)
            - 📿 Titreşimli Zikirmatik ve Kaza Defteri
            - 📅 Aylık İmsakiye Tablosu
            - 🛡️ Reklamsız, sade ve hafif tasarım
            
            ### 📱 Kurulum
            Aşağıdaki `TamVakti-2026.10.12.apk` dosyasını telefonunuza indirip kurabilirsiniz.
