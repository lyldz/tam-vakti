name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/*.apk build-output/TamVakti-2026.10.12.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/TamVakti-2026.10.12.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/TamVakti-2026.10.12.apk
          name: "Tam Vakti ${{ github.ref_name }}"
          draft: false
          prerelease: false
          body: |
            ## 🕌 Tam Vakti - Güncelleme Notları

            - **Sürüm:** `${{ github.ref_name }}`
            - **Paket:** `com.tamvakti.app`
            - Diyanet İşleri Başkanlığı uyumlu vakit motoru (Offline & Online)
            - Canlı geri sayım sayacı ve kerahat uyarısı
            - Canlı Kıble Pusulası (Sensör entegrasyonu)
            - Akıllı Zikirmatik & Kaza Namazı Defteri
            - Aylık İmsakiye Tablosu
