name: Build Tam Vakti APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Copy latest web assets to Android
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r www/* android/app/src/main/assets/www/

      - name: Build Android Release APK
        working-directory: android
        run: |
          gradle assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.01' }}"
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti-${TAG}.apk \;
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/TamVakti.apk \;
          ls -lh build-output/

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamVakti-APK
          path: build-output/*.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.04' }}
          files: build-output/*.apk
          name: "Tam Vakti ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.04' }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## 🕌 Tam Vakti v1.00.04 - Namaz & İbadet Asistanı

            - **Sürüm:** `${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.00.04' }}`
            - **Paket Adı:** `com.tamvakti.app`
            
            ### 📝 Yenilikler ve Değişiklikler (v1.00.04)
            - 🌙 **Hicri Takvim:** Miladi tarihin yanına Diyanet uyumlu Hicri takvim eklendi (*Örn: Pazartesi • 29 Rebiülahir*).
            - 🏷️ **Akıllı Hedef Etiketi:** Kart içindeki tekrarlayan etiket yerine doğrudan hedefe kalan süre başlığı getirildi (*Örn: Akşam'a kalan · 18:26*).
            - ⏱️ **Tabular Geri Sayım & Soluk Saniye:** Rakamlar zıplamayan sabit genişlikli (tabular-nums) yapıldı; saniye göz yormaması için soluklaştırıldı.
            - 📊 **İlerleme Çizgisi:** İki vakit arasında geçen süreyi ve başlangıç/bitiş saatlerini gösteren dinamik ilerleme çubuğu eklendi.
            - 🌫️ **Geçmiş Vakitler:** Geçen vakitler hafif soluklaştırılarak aktif vakitlerin önüne geçmesi engellendi.
            - 🟢 **Şu Anki Vakit:** Aktif vakit yumuşak yeşil dolgu ve "Şimdi" rozetiyle belirginleştirildi.
            - 🎯 **Sıradaki Vakit:** Geri sayımın hedefi olan sıradaki vakit ince yeşil çerçeve ve yeşil saat ile vurgulandı.
            - 📐 **Tek Satır Liste Düzeni:** Vakit listesi nefes alan zarif tek satır düzene geçirildi; yüksek kontrastlı ses butonları eklendi.
            
            ### 📱 Kurulum
            Aşağıdaki `TamVakti-v1.00.04.apk` veya `TamVakti.apk` dosyasını indirip doğrudan cihazınıza kurabilirsiniz.
